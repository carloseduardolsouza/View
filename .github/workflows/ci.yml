name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the Playwright e2e job (needs a PACS with the test studies, see docs/testing.md)"
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-csp-hash.mjs
      # blocking on purpose: a known high-severity advisory in a production dependency should be a decision, not noise
      - run: pnpm audit --prod --audit-level high

  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/make-dev-cert.sh
      - name: nginx -t
        run: |
          docker run --rm --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
            -v "$PWD/infra/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/infra/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro" \
            -v "$PWD/infra/certs:/etc/nginx/certs:ro" nginx:1.27-alpine nginx -t
      - name: compose config
        run: docker compose --env-file .env.production.example -f infra/docker-compose.prod.yml --profile tools --profile db config --quiet

  # Manual only: needs Orthanc with the studies the specs expect (CT + phantom uploads) and Chrome (preinstalled on ubuntu-latest).
  # shortcut: untested template; seed the PACS in the "Seed" step before relying on it.
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: view, POSTGRES_PASSWORD: view_ci, POSTGRES_DB: view }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U view" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://view:view_ci@localhost:5432/view
      ORTHANC_URL: http://localhost:8042
      ORTHANC_USER: orthanc
      ORTHANC_PASSWORD: orthanc_ci_pw
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Orthanc
        run: |
          sed 's/orthanc_dev_pw/orthanc_ci_pw/' infra/orthanc/orthanc.json > /tmp/orthanc.json
          docker run -d --name orthanc -p 8042:8042 -v /tmp/orthanc.json:/etc/orthanc/orthanc.json:ro jodogne/orthanc-plugins:1.12.4 /etc/orthanc/orthanc.json
          for i in $(seq 30); do curl -sf -u orthanc:orthanc_ci_pw localhost:8042/system && break; sleep 2; done
      - name: Seed
        run: echo "TODO: upload the CT/CR test studies to Orthanc (POST /instances); not versioned in the repo"
      - run: pnpm --filter @view/api migrate
        env: { DATABASE_URL: "postgres://view:view_ci@localhost:5432/view" }
      - run: |
          cp .env.example .env
          (pnpm dev > dev.log 2>&1 &)
          npx --yes wait-on http://localhost:5173 http://localhost:3000/healthz
      - run: pnpm e2e
      - if: failure()
        run: tail -n 100 dev.log
