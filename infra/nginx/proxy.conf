# TLS edge: one origin for the SPA and the API (no CORS needed). Mounted as /etc/nginx/conf.d/default.conf.
limit_req_zone $binary_remote_addr zone=dicom:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=app:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=telemetry:1m rate=1r/s;
limit_req_status 429;

# query strings carry PHI (PatientName=...): log $uri, never $request_uri
log_format safe '$remote_addr $request_id [$time_local] "$request_method $uri" $status $body_bytes_sent ${request_time}s';
access_log /var/log/nginx/access.log safe;

server_tokens off;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

upstream api { server api:3000; keepalive 16; }
upstream web { server web:8080; keepalive 4; }

server {
  listen 80;
  server_name _;
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 128k;   # biggest legitimate body is an annotation (64 KB) or preferences
  client_body_timeout 15s;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;   # overwritten, not appended: clients cannot spoof their IP
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  include /etc/nginx/security-headers.conf;

  location /dicomweb/ {
    limit_req zone=dicom burst=400 nodelay;
    proxy_buffering off;   # stream frames straight through
    proxy_pass http://api;
    include /etc/nginx/security-headers.conf;
  }
  location ~ ^/(annotations|preferences)(/|$) {
    limit_req zone=app burst=60 nodelay;
    proxy_pass http://api;
    include /etc/nginx/security-headers.conf;
  }
  location = /telemetry {
    limit_req zone=telemetry burst=10 nodelay;
    client_max_body_size 4k;
    proxy_pass http://api;
    include /etc/nginx/security-headers.conf;
  }
  # /metrics is intentionally not routed: scrape api:3000 from the internal network
  location = /api/metrics { return 404; }
  location /api/ {
    limit_req zone=app burst=20 nodelay;
    proxy_pass http://api/;   # strips the /api prefix (readyz, healthz)
    include /etc/nginx/security-headers.conf;
  }

  location / {
    proxy_pass http://web;
    include /etc/nginx/security-headers.conf;
  }
}
